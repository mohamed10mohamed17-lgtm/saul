<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>متجر ليتل ستارز | Little Stars Kids - iOS 27 Glass Edition</title>
    <!-- خط القاهرة المدمج والأداء العالي -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ==========================================================================
           1. نظام الألوان والزجاج المتوافق 100% مع كافة الشاشات والأجهزة
           ========================================================================== */
        :root {
            --bg-gradient: linear-gradient(135deg, #eef2f7 0%, #fdeff4 50%, #e6f3ff 100%);
            
            --glass-bg-fallback: rgba(255, 255, 255, 0.92);
            --glass-bg: rgba(255, 255, 255, 0.78);
            --glass-card: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.9);
            
            --ios-blur: blur(14px);

            --accent-pink: #ff3b70;
            --accent-pink-gradient: linear-gradient(135deg, #ff2a6d 0%, #ff629d 100%);
            --accent-blue: #007aff;
            --whatsapp-green: #25d366;
            --whatsapp-gradient: linear-gradient(135deg, #25d366 0%, #12b04b 100%);

            --text-dark: #111113;
            --text-muted: #666668;

            --radius-xl: clamp(20px, 4vw, 32px);
            --radius-lg: clamp(14px, 3vw, 22px);
            --radius-md: 12px;
            --radius-pill: 9999px;

            --shadow-subtle: 0 8px 24px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 14px 35px rgba(0, 0, 0, 0.1);

            --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-dark);
            padding-top: max(12px, env(safe-area-inset-top));
            padding-bottom: max(30px, env(safe-area-inset-bottom));
            padding-left: max(0px, env(safe-area-inset-left));
            padding-right: max(0px, env(safe-area-inset-right));
            line-height: 1.5;
        }

        .container {
            width: min(100% - 24px, 1240px);
            margin-inline: auto;
        }

        /* ==========================================================================
           2. الشريط العلوي العائم المتجاوب
           ========================================================================== */
        .header-sticky {
            position: sticky;
            top: max(10px, env(safe-area-inset-top));
            z-index: 1000;
            margin-bottom: clamp(20px, 4vw, 35px);
        }

        .ios-navbar {
            background: var(--glass-bg-fallback);
            background: var(--glass-bg);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow-subtle);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 900;
            font-size: clamp(1.1rem, 3.5vw, 1.4rem);
            white-space: nowrap;
        }

        .logo-icon {
            width: clamp(34px, 8vw, 42px);
            height: clamp(34px, 8vw, 42px);
            background: var(--accent-pink-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: clamp(1rem, 3vw, 1.2rem);
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.04);
            padding: 3px;
            border-radius: var(--radius-pill);
            gap: 4px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.88rem;
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            transition: var(--transition-smooth);
            white-space: nowrap;
        }

        .nav-links a.active, .nav-links a:hover {
            background: #ffffff;
            color: var(--text-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-pill);
            padding: 8px 36px 8px 14px;
            font-size: 0.88rem;
            font-weight: 600;
            outline: none;
            width: clamp(120px, 20vw, 220px);
            transition: var(--transition-smooth);
        }

        .search-box input:focus {
            background: #ffffff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 12px rgba(0, 122, 255, 0.15);
        }

        .search-box i {
            position: absolute;
            right: 12px;
            color: var(--text-muted);
            font-size: 0.85rem;
            pointer-events: none;
        }

        /* ==========================================================================
           3. قسم الهيرو الرئيسي
           ========================================================================== */
        .hero-card {
            background: var(--glass-bg-fallback);
            background: var(--glass-card);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border-radius: var(--radius-xl);
            padding: clamp(20px, 5vw, 45px);
            margin-bottom: clamp(25px, 4vw, 40px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-subtle);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
            align-items: center;
            gap: clamp(20px, 4vw, 40px);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 59, 112, 0.1);
            color: var(--accent-pink);
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: clamp(0.75rem, 2.5vw, 0.85rem);
            font-weight: 800;
            margin-bottom: 12px;
        }

        .hero-title {
            font-size: clamp(1.6rem, 5vw, 2.8rem);
            font-weight: 900;
            line-height: 1.25;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .hero-desc {
            font-size: clamp(0.9rem, 2.8vw, 1.05rem);
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .hero-img-wrapper {
            width: 100%;
            height: clamp(220px, 40vw, 320px);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-hover);
        }

        .hero-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ==========================================================================
           4. أزرار التصفية
           ========================================================================== */
        .categories-scroll-wrapper {
            display: flex;
            justify-content: flex-start;
            gap: 8px;
            margin-bottom: clamp(20px, 4vw, 30px);
            overflow-x: auto;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .categories-scroll-wrapper::-webkit-scrollbar {
            display: none;
        }

        @media (min-width: 768px) {
            .categories-scroll-wrapper {
                justify-content: center;
                flex-wrap: wrap;
            }
        }

        .cat-btn {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid var(--glass-border);
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            font-size: clamp(0.82rem, 2.5vw, 0.92rem);
            font-weight: 700;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition-smooth);
            white-space: nowrap;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--text-dark);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        /* ==========================================================================
           5. شبكة المنتجات المرنة
           ========================================================================== */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
            gap: clamp(14px, 3vw, 24px);
            margin-bottom: clamp(35px, 6vw, 60px);
        }

        .product-card {
            background: var(--glass-bg-fallback);
            background: var(--glass-card);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border-radius: var(--radius-lg);
            padding: 14px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-subtle);
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            background: #ffffff;
        }

        .card-img-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.03);
            margin-bottom: 12px;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition-smooth);
        }

        .card-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255, 255, 255, 0.92);
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--accent-pink);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .card-title {
            font-size: clamp(0.95rem, 2.8vw, 1.1rem);
            font-weight: 800;
            margin-bottom: 6px;
            line-height: 1.35;
        }

        .card-price {
            font-size: clamp(1.1rem, 3vw, 1.3rem);
            font-weight: 900;
            color: var(--accent-pink);
            margin-bottom: 12px;
        }

        .card-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-top: auto;
        }

        .btn-whatsapp {
            background: var(--whatsapp-gradient);
            color: #ffffff;
            border: none;
            padding: min(12px, 3vw) 12px;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: clamp(0.82rem, 2.5vw, 0.9rem);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            transition: var(--transition-smooth);
            min-height: 44px;
        }

        .btn-whatsapp:hover {
            opacity: 0.95;
            transform: scale(1.02);
        }

        .btn-preview {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--glass-border);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
            cursor: pointer;
            transition: var(--transition-smooth);
            font-size: 1rem;
        }

        .btn-preview:hover {
            background: #ffffff;
            color: var(--accent-blue);
        }

        /* ==========================================================================
           6. نافذة التفاصيل المنبثقة
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
            padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-sheet {
            background: rgba(255, 255, 255, 0.96);
            border-radius: var(--radius-xl);
            width: min(100%, 750px);
            max-height: min(88vh, 700px);
            overflow-y: auto;
            padding: clamp(18px, 4vw, 30px);
            position: relative;
            transform: scale(0.92);
            transition: var(--transition-smooth);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
        }

        .modal-overlay.active .modal-sheet {
            transform: scale(1);
        }

        .modal-close-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.06);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            z-index: 10;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
            gap: clamp(16px, 3vw, 25px);
            align-items: center;
        }

        .modal-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: var(--radius-md);
        }

        .size-chip {
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .size-chip.selected {
            background: var(--text-dark);
            color: #ffffff;
        }

        .qty-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0;
            flex-wrap: wrap;
        }

        .qty-stepper {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.06);
            border-radius: var(--radius-pill);
            padding: 3px;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* ==========================================================================
           7. الأقسام المعوماتية
           ========================================================================== */
        .info-panel {
            background: var(--glass-bg-fallback);
            background: var(--glass-card);
            border-radius: var(--radius-xl);
            padding: clamp(20px, 4vw, 35px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-subtle);
            margin-bottom: clamp(25px, 4vw, 40px);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.65);
            padding: 20px 15px;
            border-radius: var(--radius-lg);
            text-align: center;
            border: 1px solid var(--glass-border);
        }

        .info-box i {
            font-size: 1.8rem;
            color: var(--accent-pink);
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: clamp(0.78rem, 2.2vw, 0.88rem);
            font-weight: 600;
            padding-top: 15px;
        }

        @media (max-width: 820px) {
            .nav-links {
                display: none;
            }
            .search-box input {
                width: 130px;
            }
            .search-box input:focus {
                width: 160px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الشريط العلوي الهيدر -->
        <div class="header-sticky">
            <header class="ios-navbar">
                <a href="#" class="brand-logo">
                    <div class="logo-icon"><i class="fa-solid fa-baby-carriage"></i></div>
                    <span>ليتل ستارز</span>
                </a>

                <nav class="nav-links">
                    <a href="#home" class="active">الرئيسية</a>
                    <a href="#products">المنتجات</a>
                    <a href="#about">من نحن</a>
                    <a href="#contact">تواصل معنا</a>
                </nav>

                <div class="header-actions">
                    <div class="search-box">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="بحث..." onkeyup="filterProducts()">
                    </div>
                </div>
            </header>
